[pytest]
testpaths = tests
addopts = -p no:pytest_base_url --strict-markers
markers =
    visual: visual regression tests that compare rendered output with baselines
    service_worker: service worker lifecycle, cache, and offline behavior tests
    deployment: Wrangler deployment routing and HTTP contract tests
    cross_browser: critical behavior supported by Chromium, Firefox, and WebKit
    chromium_only: behavior that depends on Chromium-specific browser APIs
    accessibility: semantics, focus, reflow, and user preference tests
